<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>站点访问密码</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .card { background:var(--card); padding:32px 28px; border-radius:16px; width:340px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:18px; margin:0 0 6px; }
  p { color:var(--muted); font-size:13px; margin:0 0 20px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:var(--fg); font-size:15px; }
  button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#04263a; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { min-height:18px; margin-top:12px; font-size:13px; color:#f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 站点访问密码</h1>
    <p>本站点受密码保护，请输入访问密码。</p>
    <input id="pw" type="password" placeholder="访问密码" autofocus />
    <button id="go">进入</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  async function submit() {
    const pw = $("pw").value;
    $("msg").textContent = "";
    $("go").disabled = true;
    try {
      const r = await fetch("/api/site/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = "/"; }
      else { $("msg").textContent = d.error || "验证失败"; $("go").disabled = false; }
    } catch (e) { $("msg").textContent = "网络错误"; $("go").disabled = false; }
  }
  $("go").addEventListener("click", submit);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
